// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Keep every Capacitor module on the same installed toolchain. AGP 8.13 otherwise
// requests its default Build Tools 35 even when the app targets API 36.
subprojects {
    plugins.withId('com.android.application') {
        android.buildToolsVersion = rootProject.ext.buildToolsVersion
    }
    plugins.withId('com.android.library') {
        android.buildToolsVersion = rootProject.ext.buildToolsVersion
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
